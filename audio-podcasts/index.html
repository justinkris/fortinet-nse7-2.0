<style>
  :root{--bg:#faf5e9;--surface:#fffdf5;--border:#d4c89a;--text:#0a1838;--text-muted:#6b7794;--blue:#1e40af;--ink-dark:#0d1a3a;--ink-accent:#9bb8e6;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Cormorant Garamond',serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  header{padding:48px 60px 36px;background:var(--ink-dark);color:#fbf7ec;}
  .breadcrumb{font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:0.08em;color:rgba(251,247,236,0.6);margin-bottom:12px;text-transform:uppercase;}
  .breadcrumb a{color:var(--ink-accent);text-decoration:none;}
  .breadcrumb-sep{color:rgba(155,184,230,0.4);margin:0 6px;}
  header h1{font-family:'Playfair Display',serif;font-size:44px;font-weight:700;line-height:1.05;}
  header h1 em{font-style:italic;font-weight:500;color:var(--ink-accent);}
  header p{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:rgba(251,247,236,0.55);margin-top:8px;}
  main{flex:1;padding:60px 60px;display:flex;align-items:center;justify-content:center;}
  .placeholder{max-width:520px;text-align:center;border:2px dashed var(--border);border-radius:12px;background:var(--surface);padding:40px 32px;color:var(--text-muted);}
  .placeholder .eyebrow{font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:10px;}
  .placeholder h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);font-weight:600;margin-bottom:8px;}
  .placeholder p{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;line-height:1.6;}
  footer{padding:16px 60px;border-top:1px solid var(--border);background:var(--surface);font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;text-align:center;}
  @media(max-width:640px){header{padding:32px 24px 24px;}header h1{font-size:30px;}main{padding:32px 24px;}}
